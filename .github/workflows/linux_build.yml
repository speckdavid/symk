name: Linux build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # Optional: allows manual triggering

jobs:
  build:
    name: Linux build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2

      - name: Install packages
        run: sudo apt install -y cmake g++ make python3 autoconf automake libgmp-dev

      - name: Build release
        run: ./build.py

      - name: Build debug
        run: ./build.py debug

      - name: Build release without GMP
        run: ./build.py release_no_gmp

      - name: Build debug without GMP
        run: ./build.py debug_no_gmp
