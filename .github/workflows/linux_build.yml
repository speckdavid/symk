name: Linux build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # Optional: allows you to manually trigger the workflow from the GitHub UI

jobs:
  # Job 1: Build with GMP
  build_with_gmp:
    name: Linux build with gmp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2

      - name: Install packages
      	run: sudo apt install cmake g++ make python3 autoconf automake libgmp-dev

      - name: Build release
        run: ./build.py

      - name: Build debug
        run: ./build.py debug

  # Job 2: Build without GMP
  build_without_gmp:
    name: Linux build without gmp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v2

      - name: Install packages
        run: sudo apt install cmake g++ make python3 autoconf automake

      - name: Build release
        run: ./build.py

      - name: Build debug
        run: ./build.py debug
