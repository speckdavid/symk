name: MacOS build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # Optional: allows you to manually trigger the workflow from the GitHub UI

jobs:
  build:
    name: MacOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install packages
        run: brew install cmake make python3 autoconf automake gcc gmp

      - name: Build release
        run: ./build.py

      - name: Build debug
        run: ./build.py debug

      - name: Build release without GMP
        run: ./build.py release_no_gmp

      - name: Build debug without GMP
        run: ./build.py debug_no_gmp
