name: MacOS build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # Optional: allows you to manually trigger the workflow from the GitHub UI

jobs:
  # Job 1: Build with GMP
  build_with_gmp:
    name: MacOS build with gmp
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install packages
        run: brew install cmake make python3 autoconf automake gcc gmp

      - name: Build release
        run: ./build.py

      - name: Build debug
        run: ./build.py debug

  # Job 2: Build without GMP
  build_with_gmp:
    name: MacOS build without gmp
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install packages
        run: brew install cmake make python3 autoconf automake gcc

      - name: Build release
        run: ./build.py

      - name: Build debug
        run: ./build.py debug
